name: Regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ESGENIE_FORCE_MOCK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ESGENIE_OCR_CACHE_DIR: ${{ github.workspace }}/outputs/ci-ocr-cache
      ESGENIE_LLM_CACHE_DIR: ${{ github.workspace }}/outputs/ci-llm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Korean PDF fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Check isolated audit suite in a fresh checkout
        run: python -m pytest tests/audit_integrity/test_cache_connection.py -q
      - name: Run full offline regression suite
        run: python -m pytest tests -q -o junit_family=xunit1 --junitxml=outputs/ci-regression.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build guided workspace
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install browser for workspace checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check guided browser workflows
        working-directory: frontend
        run: npm test
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            outputs/ci-regression.xml
            outputs/audit_integrity_results.json
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
